name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  browser:
    name: Browser scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
  container:
    name: Container build and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: architecture-container-check-ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build the runtime image from locked dependencies
        run: docker compose build
      - name: Start the isolated demo and wait for health
        run: docker compose up -d --wait --wait-timeout 90
      - name: Verify the client, API, and persistent SQLite state
        run: node scripts/check-container.mjs
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove this job's containers and demo volume
        if: always()
        run: docker compose down --volumes
